version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: rescura_db
    environment:
      POSTGRES_USER: rescura
      POSTGRES_PASSWORD: rescura123
      POSTGRES_DB: rescura_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: rescura_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rescura_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rescura:rescura123@db:5432/rescura_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rescura_celery_worker
    command: celery -A celery_app.celery worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://rescura:rescura123@db:5432/rescura_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data:

