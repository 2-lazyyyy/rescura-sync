version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rescura_db
    environment:
      POSTGRES_USER: rescura
      POSTGRES_PASSWORD: rescura123
      POSTGRES_DB: rescura_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rescura_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rescura:rescura123@db:5432/rescura_db
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
